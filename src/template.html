<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Battleship</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <label class="sfx">
          <input
            class="sfx__input"
            type="checkbox"
            data-toggle="sound"
            checked
          />
          <span class="sfx__frame" aria-hidden="true">
            <svg class="sfx__icon" viewBox="0 0 24 24" focusable="false">
              <path class="sfx__body" d="M4 9h3l4-4v14l-4-4H4z" />
              <path class="sfx__wave" d="M15 9a4 4 0 0 1 0 6" />
              <path class="sfx__wave" d="M18 6.5a8 8 0 0 1 0 11" />
              <path class="sfx__slash" d="M14.5 9.5l6 5M20.5 9.5l-6 5" />
            </svg>
          </span>
          <span class="sfx__label">Sound</span>
        </label>

        <h1 class="wordmark">Battleship</h1>
      </header>

      <p class="status" data-status role="status" aria-live="polite">
        Place your ships to begin.
      </p>

      <section class="boards">
        <article class="board" data-seat="player">
          <h2 class="board__title" data-board-title="player">You</h2>
          <div class="grid" data-grid="player" aria-label="Your board"></div>
        </article>

        <div class="legend">
          <div class="legend__column">
            <h3 class="legend__title">Your fleet</h3>
            <ul class="fleet" data-fleet="player" aria-label="Your ships"></ul>
          </div>
          <div class="legend__column">
            <h3 class="legend__title">Enemy fleet</h3>
            <ul
              class="fleet"
              data-fleet="computer"
              aria-label="Enemy ships"
            ></ul>
          </div>
        </div>

        <article class="board" data-seat="computer">
          <h2 class="board__title" data-board-title="computer">Computer</h2>
          <div class="grid" data-grid="computer" aria-label="Enemy board"></div>
        </article>
      </section>

      <div class="controls" data-controls data-phase="placing">
        <button type="button" class="button" data-action="random">
          Random fleet
        </button>
        <button type="button" class="button" data-action="rotate">
          Rotate: horizontal
        </button>
        <button type="button" class="button" data-action="reset">Clear</button>
        <button
          type="button"
          class="button button--primary"
          data-action="start"
        >
          Start game
        </button>
        <button type="button" class="button" data-action="restart">
          Restart
        </button>
        <label class="toggle">
          <input type="checkbox" data-toggle="hit-again" />
          Fire again on a hit
        </label>
        <label class="toggle">
          <input type="checkbox" data-toggle="local" />
          Two players, pass &amp; play
        </label>
      </div>

      <div
        class="overlay overlay--gate"
        data-gate
        role="dialog"
        aria-modal="true"
        aria-labelledby="gate-title"
        hidden
      >
        <div class="overlay__panel">
          <h2 class="overlay__title" id="gate-title" data-gate-title></h2>
          <p class="overlay__message" data-gate-message></p>
          <button
            type="button"
            class="button button--primary"
            data-gate-button
            data-action="ready"
          >
            Ready
          </button>
        </div>
      </div>

      <div class="overlay" data-overlay hidden>
        <div class="overlay__panel">
          <h2 class="overlay__title" data-overlay-title></h2>
          <p class="overlay__message" data-overlay-message></p>
          <button
            type="button"
            class="button button--primary"
            data-action="play-again"
          >
            Play again
          </button>
        </div>
      </div>
    </main>
  </body>
</html>
