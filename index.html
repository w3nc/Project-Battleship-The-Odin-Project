<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Battleship</title><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/><script defer="defer" src="main.2a77a05eb7feb7ca26ba.js"></script><link href="main.a5a9213b68fbf197d7da.css" rel="stylesheet"></head><body><main class="app"><header class="masthead"><h1 class="masthead__title">Battleship</h1><p class="masthead__note">Hide your fleet, then hunt the enemy down.</p></header><p class="status" data-status role="status" aria-live="polite">Place your ships to begin.</p><div class="controls" data-controls data-phase="placing"><button type="button" class="button" data-action="random">Random fleet</button> <button type="button" class="button" data-action="rotate">Rotate: horizontal</button> <button type="button" class="button" data-action="reset">Clear</button> <button type="button" class="button button--primary" data-action="start">Start game</button> <button type="button" class="button" data-action="restart">Restart</button> <label class="toggle"><input type="checkbox" data-toggle="hit-again"/> Fire again on a hit</label> <label class="toggle"><input type="checkbox" data-toggle="local"/> Two players, pass &amp; play</label> <label class="toggle"><input type="checkbox" data-toggle="sound" checked="checked"/> Sound</label></div><section class="boards"><article class="board"><h2 class="board__title" data-board-title="player">Your fleet</h2><div class="grid" data-grid="player" aria-label="Your board"></div><ul class="fleet" data-fleet="player" aria-label="Your ships"></ul></article><article class="board"><h2 class="board__title" data-board-title="computer">Enemy waters</h2><div class="grid" data-grid="computer" aria-label="Enemy board"></div><ul class="fleet" data-fleet="computer" aria-label="Enemy ships"></ul></article></section><div class="overlay overlay--gate" data-gate role="dialog" aria-modal="true" aria-labelledby="gate-title" hidden><div class="overlay__panel"><h2 class="overlay__title" id="gate-title" data-gate-title></h2><p class="overlay__message" data-gate-message></p><button type="button" class="button button--primary" data-gate-button data-action="ready">Ready</button></div></div><div class="overlay" data-overlay hidden><div class="overlay__panel"><h2 class="overlay__title" data-overlay-title></h2><p class="overlay__message" data-overlay-message></p><button type="button" class="button button--primary" data-action="play-again">Play again</button></div></div></main></body></html>
